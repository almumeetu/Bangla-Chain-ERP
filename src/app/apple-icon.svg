<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Chain & ERP Golden Emerald Gradient -->
    <linearGradient id="brandEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyber Cyan Gradient -->
    <linearGradient id="brandCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Golden Highlight -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGradient)" stroke="url(#borderGlow)" stroke-width="8" filter="url(#softShadow)"/>

  <!-- Inner Ambient Geometric Mesh Ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#borderGlow)" stroke-width="2" stroke-dasharray="12 8" opacity="0.25"/>
  <circle cx="256" cy="256" r="140" stroke="#38bdf8" stroke-width="1.5" opacity="0.15"/>

  <!-- Interlocking ERP / Bangla-Chain Monogram Structure (S + Chain Prism + Nodes) -->
  <g filter="url(#glowEffect)">
    <!-- Top-Right Chain Loop (Cyan to Indigo) -->
    <path d="M 230 140 H 310 C 354 140 390 176 390 220 C 390 264 354 300 310 300 H 280" 
          stroke="url(#brandCyan)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom-Left Chain Loop (Emerald to Teal) -->
    <path d="M 282 372 H 202 C 158 372 122 336 122 292 C 122 248 158 212 202 212 H 232" 
          stroke="url(#brandEmerald)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Core Dynamic Cross-Connector (Interlocking 3D Node) -->
    <path d="M 216 216 L 296 296" stroke="#ffffff" stroke-width="20" stroke-linecap="round" opacity="0.95"/>
    <circle cx="256" cy="256" r="18" fill="url(#goldHighlight)" stroke="#ffffff" stroke-width="4"/>

    <!-- Top Accent Pulse Dot -->
    <circle cx="310" cy="140" r="12" fill="#38bdf8"/>
    <!-- Bottom Accent Pulse Dot -->
    <circle cx="202" cy="372" r="12" fill="#34d399"/>
  </g>

  <!-- High-Precision Gloss / Reflection Overlay -->
  <path d="M 60 120 C 100 60 160 40 256 40 C 352 40 412 60 452 120 C 370 140 280 130 180 160 C 120 180 80 220 60 260 Z" 
        fill="#ffffff" opacity="0.05"/>
</svg>
